# Multi-Server Virtual Hosting Configuration

# Default server for 127.0.0.1:8081
server {
    host 127.0.0.1
    listen 8081
    server_name localhost
    client_max_body_size 5M

    location / {
        accepted_methods GET POST
        root ./www
        index index.html
        autoindex on
    }
}

# Second virtual host on 127.0.0.1:8081 (matched via Host: secondary.local)
server {
    host 127.0.0.1
    listen 8081
    server_name secondary.local
    client_max_body_size 2M

    location / {
        accepted_methods GET
        root ./www
        index about.html
        autoindex off
    }
}

# Third server on separate port 127.0.0.1:8082
server {
    host 127.0.0.1
    listen 8082
    server_name api.local localhost
    client_max_body_size 20M

    location / {
        accepted_methods GET POST DELETE
        root ./www
        autoindex on
    }
}
