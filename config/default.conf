# Default Localhost Configuration File
# Compatible with HTTP/1.1 and 01-Edu audit specifications

server {
    host 127.0.0.1
    listen 8081 8082
    server_name localhost 127.0.0.1
    client_max_body_size 10M

    error_page 400 ./www/errors/400.html
    error_page 403 ./www/errors/403.html
    error_page 404 ./www/errors/404.html
    error_page 405 ./www/errors/405.html
    error_page 413 ./www/errors/413.html
    error_page 500 ./www/errors/500.html

    location / {
        accepted_methods GET POST DELETE
        root ./www
        index index.html
        autoindex on
    }

    location /files {
        accepted_methods GET
        root ./www/files
        autoindex on
    }

    location /upload {
        accepted_methods GET POST DELETE
        upload_dir ./www/uploads
        root ./www/uploads
        autoindex on
    }

    location /redirect-me {
        redirect 301 /
    }

    location /cgi-bin {
        accepted_methods GET POST
        root ./www/cgi-bin
        cgi .py python3
        cgi .sh /bin/bash
    }
}
