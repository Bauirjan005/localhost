<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>413 Payload Too Large - Localhost</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center;">
    <div class="card" style="max-width:500px; text-align:center; padding:3rem;">
        <div style="font-size:4rem; font-weight:800; color:#e11d48; margin-bottom:0.5rem;">413</div>
        <h1 style="font-size:1.5rem; margin-bottom:1rem;">Payload Too Large</h1>
        <p>The request payload exceeds the configured <code>client_max_body_size</code> limit for this server or location.</p>
        <a href="/" class="btn">Return to Safety</a>
    </div>
</body>
</html>
